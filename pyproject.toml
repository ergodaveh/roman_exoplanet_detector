[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "roman-exoplanet-detector"
version = "0.1.0"
description = "Roman Space Telescope microlensing exoplanet detector"
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "David" }
]

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "astropy",
    "photutils",
    "asdf",
    "scikit-learn",
    "joblib",
    "streamlit",
]

[project.optional-dependencies]

dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
    "mypy"
]

[tool.pytest.ini_options]

testpaths = [
    "tests"
]

python_files = [
    "test_*.py"
]

[tool.black]
line-length = 88

[tool.ruff]

line-length = 88

[tool.setuptools]

package-dir = {"" = "src"}

[tool.setuptools.packages.find]

where = ["src"]